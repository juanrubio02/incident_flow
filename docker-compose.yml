services:
  redis:
    image: redis:7.4-alpine
    container_name: incidentflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: maven:3.9-eclipse-temurin-21
    container_name: incidentflow-app
    working_dir: /workspace
    command: mvn spring-boot:run
    volumes:
      - ./:/workspace
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  maven-cache:
